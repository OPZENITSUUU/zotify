name: Release Desktop and Android TV Downloads

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - ".github/workflows/release-downloads.yml"
      - "tv/build.gradle.kts"
  pull_request:
    types: [closed]
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Existing release tag to backfill, or 'all' for every release"
        required: true
        default: "all"
        type: string

permissions:
  contents: write

jobs:
  release-tags:
    if: github.event_name != 'pull_request' || github.event.pull_request.merged == true
    name: Resolve published release tags
    runs-on: ubuntu-22.04
    outputs:
      tags: ${{ steps.resolve.outputs.tags }}
    steps:
      - name: Resolve tags
        id: resolve
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVENT_NAME: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          pattern='^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'
          if [[ "$EVENT_NAME" == "workflow_dispatch" && "$INPUT_TAG" != "all" ]]; then
            [[ "$INPUT_TAG" =~ $pattern ]] || { echo "::error::Invalid release tag"; exit 1; }
            gh release view "$INPUT_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null
            tags_json="$(jq -cn --arg tag "$INPUT_TAG" '[$tag]')"
          elif [[ "$REF_TYPE" == "tag" ]]; then
            [[ "$REF_NAME" =~ $pattern ]] || { echo "::error::Unsupported tag"; exit 1; }
            tags_json="$(jq -cn --arg tag "$REF_NAME" '[$tag]')"
          else
            tags_json="$(gh release list --limit 1000 --json tagName --repo "$GITHUB_REPOSITORY" \
              | jq -c '[.[].tagName | select(test("^v(0|[1-9][0-9]*)\\.(0|[1-9][0-9]*)\\.(0|[1-9][0-9]*)$"))] | unique')"
          fi
          [[ "$tags_json" != "[]" ]] || { echo "::error::No published releases found"; exit 1; }
          echo "Resolved tags: $tags_json"
          echo "tags=$tags_json" >> "$GITHUB_OUTPUT"

  desktop:
    name: Desktop ${{ matrix.platform }} · ${{ matrix.tag }}
    needs: release-tags
    runs-on: ${{ matrix.platform == 'linux' && 'ubuntu-22.04' || matrix.platform == 'windows' && 'windows-latest' || 'macos-latest' }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        tag: ${{ fromJSON(needs.release-tags.outputs.tags) }}
        platform: [linux, windows, macos]
    steps:
      - name: Check out exact release source
        uses: actions/checkout@v4
        with:
          ref: ${{ matrix.tag }}
          fetch-depth: 1

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build desktop app image (Linux/macOS)
        if: matrix.platform != 'windows'
        shell: bash
        env:
          TAG: ${{ matrix.tag }}
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
          LASTFM_SECRET: ${{ secrets.LASTFM_SECRET }}
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew :desktopApp:createDistributable "-Pbitchord.version=$TAG"

      - name: Build desktop app image (Windows)
        if: matrix.platform == 'windows'
        shell: pwsh
        env:
          TAG: ${{ matrix.tag }}
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
          LASTFM_SECRET: ${{ secrets.LASTFM_SECRET }}
        run: |
          .\gradlew.bat :desktopApp:createDistributable "-Pbitchord.version=$env:TAG"
          if ($LASTEXITCODE -ne 0) { throw "Desktop image build failed." }

      - name: Verify and archive Linux app
        id: archive-linux
        if: matrix.platform == 'linux'
        shell: bash
        env:
          TAG: ${{ matrix.tag }}
        run: |
          set -euo pipefail
          app_dir="desktopApp/build/compose/binaries/main/app/BitChord"
          test -d "$app_dir"
          jar="$(find "$app_dir" -type f -name 'desktopApp*.jar' -print -quit)"
          test -n "$jar"
          entries="$(jar tf "$jar")"
          grep -q '^models/.*\.onnx$' <<< "$entries"
          grep -q '^native/libbitchord_analysis\.so$' <<< "$entries"
          asset="ZotifyMusic-$TAG-linux-x64.tar.gz"
          tar -czf "$asset" -C "$(dirname "$app_dir")" "$(basename "$app_dir")"
          tar -tzf "$asset" >/dev/null
          test -s "$asset"
          echo "asset=$asset" >> "$GITHUB_OUTPUT"

      - name: Verify and archive Windows app
        id: archive-windows
        if: matrix.platform == 'windows'
        shell: pwsh
        env:
          TAG: ${{ matrix.tag }}
        run: |
          $appDir = Join-Path $env:GITHUB_WORKSPACE "desktopApp/build/compose/binaries/main/app/BitChord"
          if (-not (Test-Path $appDir -PathType Container)) { throw "Windows app image is missing." }
          $jar = Get-ChildItem -Path $appDir -Filter "desktopApp*.jar" -Recurse | Select-Object -First 1
          if ($null -eq $jar) { throw "Desktop application jar is missing." }
          $entries = & jar tf $jar.FullName
          if ($LASTEXITCODE -ne 0) { throw "Could not inspect desktop application jar." }
          if (-not ($entries -match '^models/.+\.onnx$')) { throw "Automix models are missing." }
          if ($entries -notcontains 'native/bitchord_analysis.dll') { throw "Windows analyser is missing." }
          if ($entries -notcontains 'native/bitchord_smtc.dll') { throw "Windows media-control bridge is missing." }
          $asset = "ZotifyMusic-$env:TAG-windows-x64.zip"
          Compress-Archive -Path $appDir -DestinationPath $asset -Force
          if (-not (Test-Path $asset) -or (Get-Item $asset).Length -le 0) { throw "Windows archive is empty." }
          "asset=$asset" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Verify and archive macOS app
        id: archive-macos
        if: matrix.platform == 'macos'
        shell: bash
        env:
          TAG: ${{ matrix.tag }}
        run: |
          set -euo pipefail
          app_dir="desktopApp/build/compose/binaries/main/app/BitChord.app"
          test -d "$app_dir"
          jar="$(find "$app_dir" -type f -name 'desktopApp*.jar' -print -quit)"
          test -n "$jar"
          entries="$(jar tf "$jar")"
          grep -q '^models/.*\.onnx$' <<< "$entries"
          arch="$(tr '[:upper:]' '[:lower:]' <<< "$RUNNER_ARCH")"
          asset="ZotifyMusic-$TAG-macos-$arch.zip"
          ditto -c -k --sequesterRsrc --keepParent "$app_dir" "$asset"
          unzip -tq "$asset"
          test -s "$asset"
          echo "asset=$asset" >> "$GITHUB_OUTPUT"

      - name: Wait for release and upload desktop asset (Linux/macOS)
        if: matrix.platform != 'windows'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ matrix.tag }}
          ASSET: ${{ matrix.platform == 'linux' && steps.archive-linux.outputs.asset || steps.archive-macos.outputs.asset }}
        run: |
          set -euo pipefail
          ready=false
          for attempt in $(seq 1 60); do
            if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              ready=true
              break
            fi
            sleep 30
          done
          [[ "$ready" == true ]] || { echo "::error::Release was not created"; exit 1; }
          gh release upload "$TAG" "$ASSET" --repo "$GITHUB_REPOSITORY" --clobber

      - name: Wait for release and upload desktop asset (Windows)
        if: matrix.platform == 'windows'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ matrix.tag }}
          ASSET: ${{ steps.archive-windows.outputs.asset }}
        run: |
          $ready = $false
          for ($attempt = 0; $attempt -lt 60; $attempt++) {
            gh release view $env:TAG --repo $env:GITHUB_REPOSITORY 1>$null 2>$null
            if ($LASTEXITCODE -eq 0) { $ready = $true; break }
            Start-Sleep -Seconds 30
          }
          if (-not $ready) { throw "Release was not created." }
          gh release upload $env:TAG $env:ASSET --repo $env:GITHUB_REPOSITORY --clobber
          if ($LASTEXITCODE -ne 0) { throw "Windows upload failed." }

  android-tv:
    name: Android TV · ${{ matrix.tag }}
    needs: release-tags
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        tag: ${{ fromJSON(needs.release-tags.outputs.tags) }}
    steps:
      - name: Check out exact release source
        uses: actions/checkout@v4
        with:
          ref: ${{ matrix.tag }}
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Align historical TV version metadata with its phone tag
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path("tv/build.gradle.kts")
          source = path.read_text(encoding="utf-8")
          old = '        versionCode = 26\n        versionName = "1.8"'
          new = (
              '        // Keep TV installs and updates in lockstep with the phone release for this tag.\n'
              '        versionCode = (rootProject.extra["bitchordVersionCode"] as Int) + 26\n'
              '        versionName = rootProject.extra["bitchordVersionName"] as String'
          )
          if old in source:
              source = source.replace(old, new, 1)
              path.write_text(source, encoding="utf-8")
          elif new not in source:
              raise SystemExit("Unrecognised TV version metadata; refusing a mismatched build.")
          PY

      - name: Align historical TV updater with platform-specific release version metadata
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path("app/src/main/java/com/music/bitchord/data/AppUpdateChecker.kt")
          source = path.read_text(encoding="utf-8")
          old = r'''    internal fun releaseVersionCode(body: String?): Long? {
                  val line = body?.lineSequence()?.firstOrNull { it.contains("Android version code:", ignoreCase = true) }
                      ?: return null
                  val match = Regex("^\\s*Android version code:\\s*(\\d+)\\s*$", RegexOption.IGNORE_CASE)
                      .matchEntire(line) ?: return null
                  return match.groupValues[1].toLongOrNull()?.takeIf { it > 0L }
              }'''
          new = r'''    private const val TV_VERSION_CODE_OFFSET = 26L

              internal fun releaseVersionCode(
                  body: String?,
                  updateApkPrefix: String = BuildConfig.UPDATE_APK_PREFIX,
              ): Long? {
                  fun parse(field: String): Long? {
                      val line = body?.lineSequence()?.firstOrNull {
                          it.trimStart().startsWith("$field:", ignoreCase = true)
                      } ?: return null
                      val match = Regex("""^\s*${Regex.escape(field)}:\s*(\d+)\s*$""", RegexOption.IGNORE_CASE)
                          .matchEntire(line) ?: return null
                      return match.groupValues[1].toLongOrNull()?.takeIf { it > 0L }
                  }

                  if (updateApkPrefix.startsWith("ZotifyMusicTV-", ignoreCase = true)) {
                      return parse("Android TV version code")
                          ?: parse("Android version code")?.plus(TV_VERSION_CODE_OFFSET)
                  }
                  return parse("Android version code")
              }'''
          if old in source:
              source = source.replace(old, new, 1)
              path.write_text(source, encoding="utf-8")
          elif new not in source:
              raise SystemExit("Could not safely align TV updater version metadata in this historical tag.")
          PY

      - name: Verify and configure official release signing key
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          umask 077
          if [[ -z "$KEYSTORE_BASE64" || -z "$KEYSTORE_PASSWORD" || -z "$KEY_ALIAS" || -z "$KEY_PASSWORD" ]]; then
            echo "::error::A required release signing secret is missing."
            exit 1
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > zotify-release.jks
          keytool -list -keystore zotify-release.jks -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" >/dev/null 2>&1
          temp_dir="$(mktemp -d)"
          trap 'rm -rf "$temp_dir"' EXIT
          keytool -exportcert -alias "$KEY_ALIAS" -keystore zotify-release.jks \
            -storepass "$KEYSTORE_PASSWORD" -file "$temp_dir/certificate.der" >/dev/null 2>&1
          actual="$(sha256sum "$temp_dir/certificate.der" | awk '{print toupper($1)}')"
          expected="EAD01DEB09889B57D7C9E16E52811CE02E85754BD6C19A483AAF772A59C7EE30"
          [[ "$actual" == "$expected" ]] || { echo "::error::Official TV signing certificate mismatch."; exit 1; }
          {
            printf 'storeFile=zotify-release.jks\n'
            printf 'storePassword=%s\n' "$KEYSTORE_PASSWORD"
            printf 'keyAlias=%s\n' "$KEY_ALIAS"
            printf 'keyPassword=%s\n' "$KEY_PASSWORD"
          } > keystore.properties
          chmod 600 zotify-release.jks keystore.properties

      - name: Build signed production TV APKs
        shell: bash
        env:
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
          LASTFM_SECRET: ${{ secrets.LASTFM_SECRET }}
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew :tv:assembleProdRelease

      - name: Verify APK identity and create TV download assets
        shell: bash
        env:
          TAG: ${{ matrix.tag }}
        run: |
          set -euo pipefail
          version="$(sed 's/^v//' <<< "$TAG")"
          phone_version_code="$(python3 .github/scripts/validate_release.py --tag "$TAG" --repository . --print-version-code)"
          expected_code="$((phone_version_code + 26))"
          output_dir="tv/build/outputs/apk/prod/release"
          if ! find "$output_dir" -maxdepth 1 -type f -name '*.apk' -print -quit | grep -q .; then
            echo "::error::No TV APKs were produced."
            exit 1
          fi
          universal="$(find "$output_dir" -maxdepth 1 -type f -name '*universal*.apk' -print -quit)"
          if [[ -z "$universal" ]]; then
            universal="$(find "$output_dir" -maxdepth 1 -type f -name '*.apk' \
              ! -name '*arm64-v8a*' ! -name '*armeabi-v7a*' ! -name '*x86_64*' -print -quit)"
          fi
          [[ -n "$universal" ]] || { echo "::error::Universal TV APK is missing."; exit 1; }

          sdk="$ANDROID_HOME"
          if [[ -z "$sdk" ]]; then sdk="$ANDROID_SDK_ROOT"; fi
          test -n "$sdk"
          build_tools="$(find "$sdk/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          mkdir -p dist
          verify_apk() {
            local apk="$1"
            local badging
            badging="$("$build_tools/aapt" dump badging "$apk")"
            grep -F "package: name='com.zotifymusic.player.tv'" <<< "$badging"
            grep -F "versionName='$version'" <<< "$badging"
            grep -F "versionCode='$expected_code'" <<< "$badging"
            "$build_tools/zipalign" -c -v 4 "$apk"
            local signer
            signer="$("$build_tools/apksigner" verify --verbose --print-certs "$apk" \
              | awk -F': ' '/Signer #1 certificate SHA-256 digest:/ {print toupper($2); exit}')"
            [[ "$signer" == "EAD01DEB09889B57D7C9E16E52811CE02E85754BD6C19A483AAF772A59C7EE30" ]] \
              || { echo "::error::TV APK signature fingerprint mismatch."; exit 1; }
          }
          verify_apk "$universal"
          cp "$universal" "dist/ZotifyMusicTV-$TAG.apk"
          while IFS= read -r apk; do
            [[ "$apk" == "$universal" ]] && continue
            name="$(basename "$apk")"
            abi=""
            for candidate in arm64-v8a armeabi-v7a x86_64; do
              if [[ "$name" == *"$candidate"* ]]; then abi="$candidate"; break; fi
            done
            if [[ -n "$abi" ]]; then
              verify_apk "$apk"
              cp "$apk" "dist/ZotifyMusicTV-$TAG"_"$abi.apk"
            fi
          done < <(find "$output_dir" -maxdepth 1 -type f -name '*.apk' | sort)
          test -s "dist/ZotifyMusicTV-$TAG.apk"
          ls -lh dist

      - name: Wait for release and upload TV downloads
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ matrix.tag }}
        run: |
          set -euo pipefail
          ready=false
          for attempt in $(seq 1 60); do
            if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              ready=true
              break
            fi
            sleep 30
          done
          [[ "$ready" == true ]] || { echo "::error::Release was not created"; exit 1; }
          gh release upload "$TAG" dist/*.apk --repo "$GITHUB_REPOSITORY" --clobber
